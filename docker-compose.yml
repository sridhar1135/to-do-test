# Self-hosted option: Postgres + the app (API and PWA on one port).
#   TODO_API_TOKEN=$(openssl rand -hex 24) docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://todo:${POSTGRES_PASSWORD:-todo}@db:5432/todo
      TODO_API_TOKEN: ${TODO_API_TOKEN:?set TODO_API_TOKEN to a long random string}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
